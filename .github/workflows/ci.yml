name: Validate portfolio files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify README is not empty
        run: test -s README.md

  check-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify index is not empty
        run: test -s index.html

      - name: Verify stylesheet and profile image exist
        run: |
          test -s css/style.css
          test -s img/profile_pic.jpg

      - name: Verify profile image is referenced in HTML
        run: grep -Fq 'img/profile_pic.jpg' index.html
